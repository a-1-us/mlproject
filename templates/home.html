<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Performance Predictor</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #4f46e5, #7c3aed, #06b6d4);
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 720px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(18px);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);
            color: white;
        }

        .heading {
            text-align: center;
            margin-bottom: 35px;
        }

        .heading h1 {
            font-size: 34px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .heading p {
            font-size: 15px;
            opacity: 0.9;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 15px;
            font-weight: 500;
        }

        select,
        input {
            width: 100%;
            padding: 14px 16px;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            background: rgba(255, 255, 255, 0.95);
            color: #333;
            outline: none;
            transition: 0.3s ease;
        }

        select:focus,
        input:focus {
            transform: scale(1.01);
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.35);
        }

        select {
            cursor: pointer;
        }

        input::placeholder {
            color: #888;
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 16px;
            background: white;
            color: #4f46e5;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s ease;
            margin-top: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            background: #f3f4f6;
        }

        .result {
            margin-top: 30px;
            padding: 20px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.2);
            text-align: center;
            font-size: 24px;
            font-weight: 600;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media(max-width:768px) {
            .container {
                padding: 25px;
            }

            .heading h1 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="heading">
            <h1>🎓 Student Performance Predictor</h1>
            
        </div>

        <form action="{{ url_for('predict_datapoint') }}"
            method="post"
            autocomplete="off">

            <div class="form-group">
                <label>Gender</label>
                <select name="gender" required>
                    <option value="" selected hidden>Select Gender</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                </select>
            </div>

            <div class="form-group">
                <label>Race / Ethnicity</label>
                <select name="race_ethnicity" required>
                    <option value="" selected hidden>Select Group</option>
                    <option value="group A">Group A</option>
                    <option value="group B">Group B</option>
                    <option value="group C">Group C</option>
                    <option value="group D">Group D</option>
                    <option value="group E">Group E</option>
                </select>
            </div>

            <div class="form-group">
                <label>Parental Level of Education</label>
                <select name="parental_level_of_education" required>
                    <option value="" selected hidden>Select Education</option>
                    <option value="high school">High School</option>
                    <option value="some college">Some College</option>
                    <option value="associate's degree">Associate Degree</option>
                    <option value="bachelor's degree">Bachelor Degree</option>
                    <option value="master's degree">Master Degree</option>
                </select>
            </div>

            <div class="form-group">
                <label>Lunch Type</label>
                <select name="lunch" required>
                    <option value="" selected hidden>Select Lunch Type</option>
                    <option value="standard">Standard</option>
                    <option value="free/reduced">Free / Reduced</option>
                </select>
            </div>

            <div class="form-group">
                <label>Test Preparation Course</label>
                <select name="test_preparation_course" required>
                    <option value="" selected hidden>Select Course Status</option>
                    <option value="none">None</option>
                    <option value="completed">Completed</option>
                </select>
            </div>

            <div class="form-group">
                <label>Reading Score</label>
                <input type="number"
                    name="reading_score"
                    min="0"
                    max="100"
                    placeholder="Enter Reading Score"
                    required>
            </div>

            <div class="form-group">
                <label>Writing Score</label>
                <input type="number"
                    name="writing_score"
                    min="0"
                    max="100"
                    placeholder="Enter Writing Score"
                    required>
            </div>

            <button class="btn" type="submit">
                🚀 Predict Maths Score
            </button>

        </form>

        {% if results %}
        <div class="result">
        Predicted Maths Score: {{ results }}
        </div>
        {% endif %}

    </div>

</body>

</html>
